<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Burning Doors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Los Angeles Burning Doors — LA’s #1 Doors Tribute Band" />

  <!-- Cinzel font to match Wix header -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Cinzel', serif;
      background: black;
      box-sizing: border-box;
      overflow: hidden;
    }

    body {
      position: relative;
      height: 100vh;
      width: 100vw;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 50px; /* LOCKED */
      background: black;
      z-index: 9999;
      pointer-events: none;
      display: block;
    }

    /* Optional debug/test mode */
    .overlay a {
      font-size: 1rem;
      visibility: hidden; /* Keep layout space */
    }

    iframe {
      position: absolute;
      top: 50px; /* Below overlay */
      left: 0;
      width: 100vw;
      height: calc(100vh - 50px);
      border: none;
      margin: 0;
      padding: 0;
      display: block;
    }

    @media (max-width: 600px) {
      .overlay {
        height: 50px;
      }
      iframe {
        top: 50px;
        height: calc(100vh - 50px);
      }
    }
  </style>
</head>
<body>

  <!-- Locked overlay bar -->
  <div class="overlay" aria-hidden="true">
    <a>Contact</a>
    <a>Upcoming Shows</a>
    <a>Past Shows</a>
    <a>Merch</a>
  </div>

  <!-- Live Wix site proxy -->
  <iframe src="https://redirectbanner.theleatherchronicler.workers.dev/"></iframe>

</body>
</html>
