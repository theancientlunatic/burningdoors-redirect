<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Burning Doors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Los Angeles Burning Doors — LA’s #1 Doors Tribute Band" />

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

  <!-- paint-blocker so the banner never flashes white -->
  <style id="critical-overlay">.overlay{background:#000;}</style>

  <style>
    html,body{
      margin:0;padding:0;height:100%;overflow:hidden;
      font-family:'Cinzel',serif;background:#000;
    }
    iframe{position:relative;width:100%;height:100%;border:none;}

    /* --- universal top-edge banner killer --- */
    .overlay{
      position:fixed;top:0;left:0;right:0;
      height:50px!important;width:100%!important;
      pointer-events:none;z-index:9999;background:#000;
      display:flex;justify-content:center;align-items:center;gap:1.5rem;
    }
    .overlay a{visibility:hidden;font-size:1rem;}

    /* ===== 1. phones (≤600 px) – mild zoom-in so no black rails ===== */
    @media (max-width:600px){
      iframe{
        position:fixed;
        top:-50px; left:0;
        width:100vw; height:calc(100vh + 50px);

        /* ~8 % zoom + slight pan left/up to fill the frame */
        transform:scale(1.08) translate(-4%, -3%);
        transform-origin:top left;
        will-change:transform;
      }
    }

    /* ===== 2. tablets (601-1024 px) – no zoom, just slide up ===== */
    @media (min-width:601px) and (max-width:1024px){
      iframe{
        position:fixed;
        top:-50px; left:0;
        width:100vw; height:calc(100vh + 50px);
        transform:translateZ(0);        /* no scale, just GPU kick */
      }
    }
    /* desktop ≥1025 px: iframe keeps its default 100 % / 100 % */
  </style>
</head>

<body>
  <div class="overlay" aria-hidden="true">
    <a>Contact</a><a>Upcoming Shows</a><a>Past Shows</a><a>Merch</a>
  </div>

  <!-- LIVE Wix content via Worker -->
  <iframe
    src="https://redirectbanner.theleatherchronicler.workers.dev/"
    title="Burning Doors">
  </iframe>

  <!-- Auto-hydration watchdog – unchanged -->
  <script defer>
  (function pokeWix(){
    let tries = 0, max = 20;
    const iv = setInterval(() => {
      const img   = document.querySelector('img[alt*="Break"],img[src*="break"]'),
            home  = document.querySelector('a[href="/"]'),
            inner = [...document.querySelectorAll('a[href^="/"]')][0],
            tgt   = img || home || inner;
      if (tgt){ tgt.click(); clearInterval(iv); return; }
      if (++tries >= max) clearInterval(iv);
    }, 1000);
  })();
  </script>
</body>
</html>
