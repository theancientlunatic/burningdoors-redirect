<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Burning Doors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Los Angeles Burning Doors — LA’s #1 Doors Tribute Band" />

  <!-- Cinzel font to match Wix header -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Cinzel', serif;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 🔧 DESKTOP/TOP OVERLAY — Unchanged */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 44px;
      background: black;
      z-index: 9999;

      pointer-events: none;
      display: block;
      box-sizing: content-box;
      overflow: hidden;
    }

    /* ✅ MOBILE FIX: Only show top bar */
    @media (max-width: 768px) {
      .overlay {
        height: 44px !important;
        border: none !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="overlay" aria-hidden="true">
    <!-- Optional: invisible links for hydration anchors -->
    <a>Contact</a>
    <a>Upcoming Shows</a>
    <a>Past Shows</a>
    <a>Merch</a>
  </div>

  <!-- 🔗 Your Wix Proxy Embed -->
  <iframe src="/" title="The Burning Doors Site"></iframe>
</body>
</html>
